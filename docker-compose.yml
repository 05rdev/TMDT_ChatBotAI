version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: tmdt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tmdt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tmdt_password}
      POSTGRES_DB: ${POSTGRES_DB:-tmdt_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tmdt_user} -d ${POSTGRES_DB:-tmdt_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tmdt_network

  redis:
    image: redis:7-alpine
    container_name: tmdt_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD:-redis_password}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tmdt_network

  # Uncomment khi cần chạy app trong Docker
  # app:
  #   build: .
  #   container_name: tmdt_app
  #   restart: unless-stopped
  #   env_file: .env
  #   ports:
  #     - '${PORT:-3000}:3000'
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - tmdt_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  tmdt_network:
    driver: bridge
